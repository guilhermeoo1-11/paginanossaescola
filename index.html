<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escola</title>


  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topo">
    <img class="cabecalho-imagem" src="logo_nossa_escola.png" alt="Logo da escola">

    <h1 class="titulo_site">Nossa Escola</h1>

    <div class="sociais">
      <img src="whatsapp.png" alt="WhatsApp">
      <img src="instagram.png" alt="Instagram">
      <img src="facebook.png" alt="Facebook">
    </div>
  </header>

  <section class="banner">
    <img class="escola-imagem" src="paragrafo_1_banner.jpg" alt="Banner da escola">
  </section>


  <section class="estudante">
    <h2 class="estudante_titulo">Alunos em destaque 2025</h2>

    <div class="estudante_todos">


      <div class="estudante_div">
        <img class="estudante-imagem" src="estudante_menino.png" alt="Aluno 1">
        <h3 class="estudante_nome">Aluno 1</h3>

        <div class="icones">
          <img src="logo_nossa_escola.png">
          <img src="instagram.png">
          <img src="facebook.png">
        </div>
      </div>


      <div class="estudante_div">
        <img class="estudante-imagem" src="estudante_menino.png">
        <h3 class="estudante_nome">Aluno 2</h3>
      </div>

      <div class="estudante_div">
        <img class="estudante-imagem" src="estudante_menino.png">
        <h3 class="estudante_nome">Aluno 3</h3>
      </div>

      <div class="estudante_div">
        <img class="estudante-imagem" src="estudante_menino.png">
        <h3 class="estudante_nome">Aluno 4</h3>
      </div>

      <div class="estudante_div">
        <img class="estudante-imagem" src="estudante_menino.png">
        <h3 class="estudante_nome">Aluno 5</h3>
      </div>

      <div class="estudante_div">
        <img class="estudante-imagem" src="estudante_menino.png">
        <h3 class="estudante_nome">Aluno 6</h3>
      </div>

    </div>
  </section>


  <footer class="rodape">
    <p>Mais informações: +55 41 9.9999-9999</p>
  </footer>

</body>
</html>
